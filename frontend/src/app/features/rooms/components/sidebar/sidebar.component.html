<aside class="sidebar">
  <div class="sidebar__brand">
    <div class="brand-logo">
      <span>PC</span>
    </div>
    <span class="brand-title">PCenter</span>
  </div>

  <div class="sidebar__profile">
    <div class="profile-avatar">
      <div class="avatar-initials">{{ userInitials }}</div>
      <span class="status-indicator"></span>
    </div>
    <div class="profile-info">
      <span class="profile-name">{{ userName }}</span>
      <span class="profile-status">Online</span>
    </div>
  </div>

  <nav class="sidebar__nav">
    <a [routerLink]="item.route ? item.route : null"
       class="nav-item" 
       *ngFor="let item of navItems" 
       [routerLinkActive]="item.route ? 'active' : ''"
       [routerLinkActiveOptions]="{exact: false}"
       [class.active]="item.active">
      <div class="active-indicator"></div>
      <lucide-icon [img]="item.icon" class="nav-icon"></lucide-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>
</aside>
