<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pcenter – Learning Management Platform</title>
  <meta name="description" content="Create your Pcenter account and access a world-class learning management platform.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Inter font – variable weight for optimal typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    Anti-flash script: runs synchronously before Angular boots.
    Sets the correct theme class on <html> so there is zero flash.
  -->
  <script>
    (function () {
      var saved = localStorage.getItem('pcenter_theme');
      var dark = saved !== null
        ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

</head>
<body>
  <app-root></app-root>
</body>
</html>
